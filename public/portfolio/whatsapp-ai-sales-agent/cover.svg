  <svg x="610" y="82" width="380" height="1036"><clipPath id="pc600"><rect width="380" height="1036" rx="36"/></clipPath><g clip-path="url(#pc600)"><rect x="0" y="0" width="380" height="1036" rx="0" fill="#0e1a17" /><rect x="0" y="0" width="380" height="96" rx="0" fill="#122520" /><circle cx="44" cy="62" r="20" fill="#25D366"/><text x="76" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start" opacity="1">Libas</text><text x="76" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#25D366" text-anchor="start" opacity="1">AI assistant · online</text><rect x="18" y="120" width="239.2" height="85" rx="16" fill="#1a1d26" /><text x="32" y="146" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">Assalam o Alaikum! Is the</text><text x="32" y="167" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">black kurta available in</text><text x="32" y="188" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">medium?</text><rect x="81.80000000000001" y="219" width="280.2" height="85" rx="16" fill="#1f3b33" /><text x="95.80000000000001" y="245" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">Walaikum Assalam! Yes — Medium</text><text x="95.80000000000001" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">is in stock 🎉 Delivery in</text><text x="95.80000000000001" y="287" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">Karachi takes 1–2 days.</text><rect x="18" y="318" width="230.99999999999997" height="43" rx="16" fill="#1a1d26" /><text x="32" y="344" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">Great, what's the fabric?</text><rect x="81.80000000000001" y="375" width="280.2" height="64" rx="16" fill="#1f3b33" /><text x="95.80000000000001" y="401" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">It's 100% cotton lawn. Here it</text><text x="95.80000000000001" y="422" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#eaeaea" text-anchor="start" opacity="1">is:</text><rect x="18" y="453" width="235.6" height="190" rx="16" fill="#1a1d26" /><rect x="28" y="463" width="215.6" height="110" rx="10" fill="#25D36644" /><text x="32" y="599" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="start" opacity="1">Black lawn kurta</text><text x="32" y="623" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#25D366" text-anchor="start" opacity="1">₨ 4,990 · In stock</text><rect x="16" y="970" width="292" height="46" rx="23" fill="#1a1d26" /><text x="40" y="999" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#9a9aa5" text-anchor="start" opacity="1">Type a message</text><circle cx="338" cy="993" r="22" fill="#25D366"/></g></svg>
